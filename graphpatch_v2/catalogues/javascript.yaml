# GraphPatch language specification: JavaScript / Node.js (tree-sitter front end, graphpatch_v2/polyglot.py).
# Same four CWEs as Java. A call name with a dot matches a callee ending with it; a bare name matches its last part.
language: javascript
parser: tree-sitter-javascript
extensions: [.js, .jsx, .mjs, .cjs]
skip_paths: ["/test/", "/tests/", "/__tests__/", ".test.js", ".spec.js", "/.", "/node_modules/", "/dist/", "/build/", ".min.js"]
sources:
  untrusted_prefix: {regex: '^(req|request|ctx\.request|ctx)\.(query|body|params|cookies|signedCookies|headers|url|originalUrl|path|files|file)\b|^process\.argv\b|^(window\.)?location\.(hash|search|href)\b|^document\.(cookie|referrer|URL)\b'}
  untrusted_calls: [prompt]
  archive_name: {regex: '\.(path|fileName|entryName|name)$'}
  archive_iterators: [getEntries, entries]
sinks:
  CWE-022:
    calls: [readFile, readFileSync, writeFile, writeFileSync, appendFile, appendFileSync, createReadStream,
            createWriteStream, unlink, unlinkSync, rm, rmSync, rmdir, rmdirSync, mkdir, mkdirSync, rename, renameSync,
            readdir, readdirSync, open, openSync, copyFile, copyFileSync, sendFile, download, res.sendFile, res.download]
  CWE-078:
    calls: [exec, execSync, spawn, spawnSync, execFile, execFileSync, child_process.exec, shelljs.exec, shell.exec]
  CWE-079:
    calls: [res.send, res.write, res.end, response.send, response.write, document.write, document.writeln,
            insertAdjacentHTML, $.html, html, ctx.body]
    # assignments to these properties are sinks too (el.innerHTML = x)
    properties: [innerHTML, outerHTML, srcdoc, ctx.body]
  CWE-094:
    calls: [eval, Function, setTimeout, setInterval, vm.runInNewContext, vm.runInThisContext, vm.runInContext,
            vm.Script, vm.compileFunction, require, import]
sanitizers:
  CWE-022: {regex: '(^|\.)(basename|sanitize\w*|sanitizeFilename)$'}
  CWE-078: {regex: '(^|\.)(quote|escapeShell\w*|shellescape|sanitize\w*)$'}
  CWE-079: {regex: '(^|\.)(escape|escapeHtml|encodeURIComponent|encodeURI|sanitize|DOMPurify\.sanitize|xss|filterXSS|he\.encode|textContent)$'}
  CWE-094: {regex: '(^|\.)(parseInt|parseFloat|Number|JSON\.parse|sanitize\w*)$'}
guards:
  guard_test: {regex: 'startsWith|relative\(|resolve\(|normalize\(|realpath|\.test\(|\.match\(|includes\(|indexOf\(|"\.\."|''\.\.'''}
  exits: [throw_statement, return_statement]
  exit_calls: {regex: '(^|\.)(next|status|sendStatus|exit|process\.exit)$'}
